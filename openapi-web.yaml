        travailleurId:
          type: string
          format: uuid
          description: Réservé à l'agent qui saisit pour un travailleur
        date:
          type: string
          format: date
        periode:
          $ref: '#/components/schemas/PeriodeDispo'
        heureDebut:
          type: string
