          $ref: '#/components/schemas/Metier'
        zone:
          $ref: '#/components/schemas/Zone'
        date:
          type: string
          format: date
        typeHoraire:
          $ref: '#/components/schemas/TypeHoraire'
        remunerationFcfa:
          type: integer
        statut:
          $ref: '#/components/schemas/StatutMission'
    Disponibilite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        periode:
          $ref: '#/components/schemas/PeriodeDispo'
        heureDebut:
          type: string
          nullable: true
        heureFin:
