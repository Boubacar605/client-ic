openapi: 3.0.3
info:
  title: XeuySil API - Console web (agents, modérateurs, administrateurs)
  version: 0.1.0-draft
  description: 'Contrat de la console web d''administration.

    Dérivé du contrat complet ; ne contient que les routes utilisées par l''équipe XeuySil.


    **Conventions**

    - Toutes les routes sont sous `/v1`. Dates ISO 8601, heures `HH:mm`, fuseau Africa/Dakar.

    - `Authorization: Bearer <accessToken>` ; les comptes de l''équipe sont créés par un administrateur
    (pas d''inscription libre).

    - `X-Correlation-Id` accepté et toujours renvoyé ; `Idempotency-Key` sur les POST de création.

    - Erreurs `application/problem+json` avec un `code` stable.

    - Listes paginées : `page` (dès 1) et `taille` (défaut 20, max 100).

    - Un agent agit au nom d''un travailleur ou d''un recruteur : l''action est tracée à son nom (RB-16)
    avec le canal APPEL.

    - Les numéros d''autrui restent masqués tant que la candidature n''est pas CONFIRMEE (RB-17), sauf
    pour l''agent et l''administrateur dans leur périmètre.

    '
servers:
- url: http://localhost:4011/v1
  description: Mock Prism (console web)
- url: http://localhost:8080/v1
  description: Passerelle locale (docker compose)
tags:
- name: Auth
- name: Profil
- name: Référentiels
- name: Missions
- name: Candidatures
- name: Disponibilités
- name: Évaluations
- name: Assistance (agent)
- name: Administration
- name: Santé
security:
- bearerAuth: []
paths:
  /auth/otp/demande:
    post:
      tags:
      - Auth
      summary: Demander un code OTP par téléphone (connexion ou inscription)
      security: []
      x-roles:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - telephone
              properties:
                telephone:
                  $ref: '#/components/schemas/Telephone'
      responses:
        '204':
          description: Code envoyé
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TropDeRequetes'
  /auth/otp/verification:
    post:
      tags:
      - Auth
      summary: Vérifier le code OTP et obtenir les jetons (compte existant de l'équipe)
      description: 'Le compte doit déjà exister (créé par un administrateur) : pas d''inscription ici.
        Voir la décision en suspens sur un éventuel mot de passe.'
      security: []
      x-roles:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - telephone
              - code
              properties:
                telephone:
                  $ref: '#/components/schemas/Telephone'
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: Connexion ou inscription réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jetons'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TropDeRequetes'
  /auth/rafraichissement:
    post:
      tags:
      - Auth
      summary: Renouveler le jeton d'accès
      security: []
      x-roles:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Nouveaux jetons (rotation du refresh token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jetons'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
  /auth/deconnexion:
    post:
      tags:
      - Auth
      summary: Révoquer le jeton de rafraîchissement
      x-roles:
      - tous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: Déconnecté
  /me:
    get:
      tags:
      - Profil
      summary: Mon profil
      x-roles:
      - tous
      responses:
        '200':
          description: Profil de l'utilisateur connecté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profil'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
    patch:
      tags:
      - Profil
      summary: Modifier mon profil
      x-roles:
      - tous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilModification'
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profil'
        '422':
          $ref: '#/components/responses/Validation'
  /me/consentements:
    get:
      tags:
      - Profil
      summary: Mes consentements par canal
      x-roles:
      - tous
      responses:
        '200':
          description: Liste des consentements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consentement'
    put:
      tags:
      - Profil
      summary: Accorder ou retirer un consentement (désinscription possible à tout moment)
      x-roles:
      - tous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentementEntree'
      responses:
        '200':
          description: Consentement enregistré (tracé avec date et auteur)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consentement'
  /metiers:
    get:
      tags:
      - Référentiels
      summary: Liste des métiers actifs
      x-roles:
      - tous
      parameters:
      - name: categorie
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Métiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Metier'
    post:
      tags:
      - Administration
      summary: Créer un métier
      x-roles:
      - ADMINISTRATEUR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetierEntree'
      responses:
        '201':
          description: Métier créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metier'
        '422':
          $ref: '#/components/responses/Validation'
  /metiers/{id}:
    patch:
      tags:
      - Administration
      summary: Modifier ou désactiver un métier
      x-roles:
      - ADMINISTRATEUR
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetierEntree'
      responses:
        '200':
          description: Métier mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metier'
        '404':
          $ref: '#/components/responses/Introuvable'
  /zones:
    get:
      tags:
      - Référentiels
      summary: Liste des zones (hiérarchie région > département > commune > quartier)
      x-roles:
      - tous
      parameters:
      - name: parentId
        in: query
        schema:
          type: string
          format: uuid
      - name: niveau
        in: query
        schema:
          $ref: '#/components/schemas/NiveauZone'
      responses:
        '200':
          description: Zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
    post:
      tags:
      - Administration
      summary: Créer une zone
      x-roles:
      - ADMINISTRATEUR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneEntree'
      responses:
        '201':
          description: Zone créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '422':
          $ref: '#/components/responses/Validation'
  /missions:
    get:
      tags:
      - Missions
      summary: Lister des missions
      description: 'Comportement selon le rôle et `portee` :

        - TRAVAILLEUR, `portee=pertinentes` : missions compatibles avec son profil (métier, zone, disponibilité).

        - RECRUTEUR, `portee=miennes` : ses propres missions.

        - Agent, modérateur, administrateur : toutes les missions, filtrables.

        '
      x-roles:
      - AGENT
      - MODERATEUR
      - ADMINISTRATEUR
      parameters:
      - name: portee
        in: query
        schema:
          type: string
          enum:
          - pertinentes
          - miennes
          - toutes
          default: pertinentes
      - name: statut
        in: query
        schema:
          $ref: '#/components/schemas/StatutMission'
      - name: metierId
        in: query
        schema:
          type: string
          format: uuid
      - name: zoneId
        in: query
        schema:
          type: string
          format: uuid
      - name: dateDebut
        in: query
        schema:
          type: string
          format: date
      - name: dateFin
        in: query
        schema:
          type: string
          format: date
      - name: urgente
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page de missions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMissions'
    post:
      tags:
      - Missions
      summary: Publier une mission
      description: 'Valide les règles (RB-01 durée d''au plus une journée, RB-19, cohérence du type d''horaire),

        enregistre en PUBLIEE (ou BROUILLON), puis déclenche le matching.

        Un agent peut publier pour un recruteur via `recruteurId`.

        '
      x-roles:
      - AGENT
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionCreation'
      responses:
        '201':
          description: Mission créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '422':
          $ref: '#/components/responses/Validation'
  /missions/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Missions
      summary: Détail d'une mission
      x-roles:
      - AGENT
      - MODERATEUR
      - ADMINISTRATEUR
      responses:
        '200':
          description: Mission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '404':
          $ref: '#/components/responses/Introuvable'
    patch:
      tags:
      - Missions
      summary: Modifier une mission (tant qu'elle n'est pas EN_COURS)
      x-roles:
      - AGENT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionModification'
      responses:
        '200':
          description: Mission mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '409':
          $ref: '#/components/responses/Conflit'
        '422':
          $ref: '#/components/responses/Validation'
  /missions/{id}/annulation:
    post:
      tags:
      - Missions
      summary: Annuler une mission (les candidats confirmés sont prévenus)
      x-roles:
      - AGENT
      - ADMINISTRATEUR
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motif:
                  type: string
      responses:
        '200':
          description: Mission ANNULEE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '409':
          $ref: '#/components/responses/Conflit'
  /missions/{id}/duplication:
    post:
      tags:
      - Missions
      summary: Dupliquer une mission avec une nouvelle date
      x-roles:
      - AGENT
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - date
              properties:
                date:
                  type: string
                  format: date
      responses:
        '201':
          description: Nouvelle mission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
  /missions/{id}/suspension:
    post:
      tags:
      - Administration
      summary: Suspendre une mission (modération)
      x-roles:
      - MODERATEUR
      - ADMINISTRATEUR
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - motif
              properties:
                motif:
                  type: string
      responses:
        '200':
          description: Mission SUSPENDUE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
    delete:
      tags:
      - Administration
      summary: Lever la suspension
      x-roles:
      - MODERATEUR
      - ADMINISTRATEUR
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Mission réactivée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
  /missions/{id}/cloture:
    post:
      tags:
      - Missions
      summary: Clôturer la mission et saisir les présences
      x-roles:
      - AGENT
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - presences
              properties:
                presences:
                  type: array
                  items:
                    type: object
                    required:
                    - candidatureId
                    - presence
                    properties:
                      candidatureId:
                        type: string
                        format: uuid
                      presence:
                        type: string
                        enum:
                        - PRESENT
                        - ABSENT
      responses:
        '200':
          description: Mission TERMINEE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '409':
          $ref: '#/components/responses/Conflit'
  /missions/{id}/candidatures:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Candidatures
      summary: Candidatures d'une mission
      x-roles:
      - AGENT
      - MODERATEUR
      - ADMINISTRATEUR
      parameters:
      - name: statut
        in: query
        schema:
          $ref: '#/components/schemas/StatutCandidature'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page de candidatures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCandidatures'
  /candidatures/{id}:
    get:
      tags:
      - Candidatures
      summary: Détail d'une candidature
      x-roles:
      - AGENT
      - ADMINISTRATEUR
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Candidature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidature'
        '404':
          $ref: '#/components/responses/Introuvable'
  /candidatures/{id}/reponse:
    post:
      tags:
      - Candidatures
      summary: Répondre OUI ou NON à une proposition (PROPOSEE)
      description: Saisie par l'agent d'une réponse reçue par appel. L'action est tracée à son nom (RB-16).
      x-roles:
      - AGENT
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reponse
              - canal
              properties:
                reponse:
                  type: string
                  enum:
                  - OUI
                  - NON
                canal:
                  type: string
                  enum:
                  - APPEL
                  - SMS
      responses:
        '200':
          description: Candidature mise à jour (INTERESSE, REFUSEE ou CONFIRMEE selon le mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidature'
        '409':
          $ref: '#/components/responses/Conflit'
  /candidatures/{id}/selection:
    post:
      tags:
      - Candidatures
      summary: Sélectionner un candidat (INTERESSE vers SELECTIONNEE)
      description: Échoue en 409 CAPACITE_ATTEINTE s'il n'y a plus de place libre. Un délai de réponse
        démarre (RB-13).
      x-roles:
      - AGENT
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Candidature SELECTIONNEE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidature'
        '409':
          $ref: '#/components/responses/Conflit'
  /candidatures/{id}/refus:
    post:
      tags:
      - Candidatures
      summary: Refuser un candidat
      x-roles:
      - AGENT
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Candidature REFUSEE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidature'
  /candidatures/{id}/confirmation:
    post:
      tags:
      - Candidatures
      summary: Confirmer sa participation (SELECTIONNEE vers CONFIRMEE)
      description: 'Réserve la place avec verrou transactionnel (RB-05 : jamais plus de confirmés que
        de postes).

        En cas d''échec, 409 CAPACITE_ATTEINTE (la candidature passe en LISTE_ATTENTE) ou PROPOSITION_EXPIREE.

        '
      x-roles:
      - AGENT
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Candidature CONFIRMEE, contacts révélés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidature'
        '409':
          $ref: '#/components/responses/Conflit'
  /candidatures/{id}/desistement:
    post:
      tags:
      - Candidatures
      summary: Se désister (la place est libérée, un remplaçant est recherché, RB-12)
      x-roles:
      - AGENT
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motif:
                  type: string
      responses:
        '200':
          description: Candidature ANNULEE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidature'
        '409':
          $ref: '#/components/responses/Conflit'
  /disponibilites:
    get:
      tags:
      - Disponibilités
      summary: Mes disponibilités
      x-roles:
      - AGENT
      parameters:
      - name: dateDebut
        in: query
        schema:
          type: string
          format: date
      - name: dateFin
        in: query
        schema:
          type: string
          format: date
      - name: travailleurId
        in: query
        description: Réservé à l'agent
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Disponibilités
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disponibilite'
    post:
      tags:
      - Disponibilités
      summary: Déclarer une disponibilité
      x-roles:
      - AGENT
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisponibiliteEntree'
      responses:
        '201':
          description: Disponibilité créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilite'
        '409':
          $ref: '#/components/responses/Conflit'
        '422':
          $ref: '#/components/responses/Validation'
  /disponibilites/{id}:
    delete:
      tags:
      - Disponibilités
      summary: Retirer une disponibilité
      x-roles:
      - AGENT
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Supprimée
        '404':
          $ref: '#/components/responses/Introuvable'
  /utilisateurs/{id}/evaluations:
    get:
      tags:
      - Évaluations
      summary: Évaluations reçues par un utilisateur
      x-roles:
      - AGENT
      - MODERATEUR
      - ADMINISTRATEUR
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Évaluations et moyenne
          content:
            application/json:
              schema:
                type: object
                properties:
                  moyenne:
                    type: number
                    format: float
                    nullable: true
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Evaluation'
  /agent/travailleurs:
    post:
      tags:
      - Assistance (agent)
      summary: Inscrire un travailleur avec son accord (consentement enregistré)
      x-roles:
      - AGENT
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - telephone
              - nom
              - consentements
              properties:
                telephone:
                  $ref: '#/components/schemas/Telephone'
                nom:
                  type: string
                langue:
                  type: string
                  example: wo
                metiers:
                  type: array
                  items:
                    type: object
                    properties:
                      metierId:
                        type: string
                        format: uuid
                      experienceAnnees:
                        type: integer
                zoneIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                consentements:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/ConsentementEntree'
      responses:
        '201':
          description: Travailleur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profil'
        '409':
          $ref: '#/components/responses/Conflit'
  /agent/utilisateurs:
    get:
      tags:
      - Assistance (agent)
      summary: Rechercher un travailleur ou un recruteur (par nom ou téléphone)
      x-roles:
      - AGENT
      - ADMINISTRATEUR
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 3
      responses:
        '200':
          description: Résultats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profil'
  /agent/reponses-incomprises:
    get:
      tags:
      - Assistance (agent)
      summary: Réponses WhatsApp non comprises à traiter à la main
      x-roles:
      - AGENT
      - ADMINISTRATEUR
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page de réponses incomprises
          content:
