          format: date-time
    Signalement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        auteur:
          $ref: '#/components/schemas/ResumeUtilisateur'
        cibleType:
          type: string
          enum:
          - UTILISATEUR
          - MISSION
        cibleId:
          type: string
          format: uuid
        motif:
          type: string
        description:
          type: string
          nullable: true
        statut:
          $ref: '#/components/schemas/StatutSignalement'
        decision:
          type: string
          nullable: true
        creeLe:
          type: string
          format: date-time
    ReponseIncomprise:
      type: object
      properties:
        id:
          type: string
          format: uuid
        travailleur:
          $ref: '#/components/schemas/ResumeUtilisateur'
        texteRecu:
          type: string
          example: oui je viens
        candidatureId:
          type: string
          format: uuid
          nullable: true
        recueLe:
          type: string
          format: date-time
        traitee:
          type: boolean
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: proposition
        canal:
          $ref: '#/components/schemas/Canal'
        statut:
          $ref: '#/components/schemas/StatutMessage'
        destinataire:
