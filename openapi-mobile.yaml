openapi: 3.0.3
info:
  title: XeuySil API - Application mobile
  version: 0.1.0-draft
  description: 'Contrat de l''application mobile (travailleurs et recruteurs).

    Dérivé du contrat complet ; ne contient que les routes utilisées par le mobile.


    **Conventions**

    - Toutes les routes sont sous `/v1`. Dates ISO 8601 (`2026-11-20`), heures `HH:mm`, fuseau Africa/Dakar.

    - `Authorization: Bearer <accessToken>` (JWT court) + jeton de rafraîchissement, stockés dans le stockage
    sécurisé du téléphone.

    - `X-Correlation-Id` accepté et toujours renvoyé.

    - `Idempotency-Key` (UUID) sur les POST de création : permet de rejouer une requête après une coupure
    réseau sans doublon.

    - Erreurs `application/problem+json` avec un `code` stable (CAPACITE_ATTEINTE, CHEVAUCHEMENT, PROPOSITION_EXPIREE...).

    - Listes paginées : `page` (dès 1) et `taille` (défaut 20, max 100).

    - Le téléphone d''autrui est `null` tant que la candidature n''est pas CONFIRMEE (RB-17).

    - Émulateur Android : utiliser `10.0.2.2` à la place de `localhost`.

    '
servers:
- url: http://localhost:4010
  description: Mock Prism (iPhone sur le même réseau, navigateur)
- url: http://10.0.2.2:4010
  description: Mock Prism vu depuis l'émulateur Android
- url: http://localhost:8080
  description: Passerelle locale (docker compose)
tags:
- name: Auth
- name: Profil
- name: Référentiels
- name: Missions
- name: Candidatures
- name: Disponibilités
- name: Évaluations
- name: Signalements
- name: Santé
security:
- bearerAuth: []
paths:
  /v1/auth/otp/demande:
    post:
      tags:
      - Auth
      summary: Demander un code OTP par téléphone (connexion ou inscription)
      security: []
      x-roles:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - telephone
              properties:
                telephone:
                  $ref: '#/components/schemas/Telephone'
      responses:
        '204':
          description: Code envoyé
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TropDeRequetes'
  /v1/auth/otp/verification:
    post:
      tags:
      - Auth
      summary: Vérifier le code OTP et obtenir les jetons
      description: 'Si le téléphone est inconnu, `role` et `nom` sont obligatoires et le compte est créé
        (inscription).

        Le consentement initial est enregistré à ce moment (RB sur consentement).

        '
      security: []
      x-roles:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - telephone
              - code
              properties:
                telephone:
                  $ref: '#/components/schemas/Telephone'
                code:
                  type: string
                  example: '123456'
                role:
                  type: string
                  enum:
                  - TRAVAILLEUR
                  - RECRUTEUR
                  description: Obligatoire à l'inscription
                nom:
                  type: string
                  description: Obligatoire à l'inscription
                langue:
                  type: string
                  example: fr
                consentements:
                  type: array
                  items:
                    $ref: '#/components/schemas/ConsentementEntree'
      responses:
        '200':
          description: Connexion ou inscription réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jetons'
              examples:
                recruteur:
                  value:
                    accessToken: mock.access.token
                    refreshToken: mock.refresh.token
                    expiresIn: 900
                    nouveauCompte: false
                    utilisateur: &id001
                      id: 00000000-0000-4000-8000-000000000001
                      nom: Aïssatou Ndiaye
                      telephone: '+221771234567'
                      role: RECRUTEUR
                      statut: ACTIF
                      langue: fr
                      creeLe: '2026-10-12T09:00:00Z'
                      typeRecruteur: PARTICULIER
                travailleur:
                  value:
                    accessToken: mock.access.token
                    refreshToken: mock.refresh.token
                    expiresIn: 900
                    nouveauCompte: false
                    utilisateur: &id002
                      id: 00000000-0000-4000-8000-000000000002
                      nom: Abdou Fall
                      telephone: '+221785400756'
                      role: TRAVAILLEUR
                      statut: ACTIF
                      langue: fr
                      creeLe: '2026-10-20T08:30:00Z'
                      scoreFiabilite: 92.0
                      possedeSonMateriel: true
                      enPause: false
                      metiers:
                      - metier: &id003
                          id: 00000000-0000-4000-8000-000000000100
                          libelle: Maçon
                          categorie: Bâtiment
                          actif: true
                        experienceAnnees: 6
                      - metier: &id004
                          id: 00000000-0000-4000-8000-000000000101
                          libelle: Manœuvre
                          categorie: Bâtiment
                          actif: true
                        experienceAnnees: 3
                      zones:
                      - &id005
                        id: 00000000-0000-4000-8000-000000000200
                        nom: Pikine
                        niveau: COMMUNE
                        parentId: null
                      - &id006
                        id: 00000000-0000-4000-8000-000000000205
                        nom: Thiaroye
                        niveau: COMMUNE
                        parentId: null
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TropDeRequetes'
  /v1/auth/rafraichissement:
    post:
      tags:
      - Auth
      summary: Renouveler le jeton d'accès
      security: []
      x-roles:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Nouveaux jetons (rotation du refresh token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jetons'
              example:
                accessToken: mock.access.token
                refreshToken: mock.refresh.token
                expiresIn: 900
                nouveauCompte: false
                utilisateur: *id001
        '401':
          $ref: '#/components/responses/NonAuthentifie'
  /v1/auth/deconnexion:
    post:
      tags:
      - Auth
      summary: Révoquer le jeton de rafraîchissement
      x-roles:
      - tous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: Déconnecté
  /v1/me:
    get:
      tags:
      - Profil
      summary: Mon profil
      x-roles:
      - tous
      responses:
        '200':
          description: Profil de l'utilisateur connecté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profil'
              examples:
                recruteur:
                  value: *id001
                travailleur:
                  value: *id002
        '401':
          $ref: '#/components/responses/NonAuthentifie'
    patch:
      tags:
      - Profil
      summary: Modifier mon profil
      x-roles:
      - tous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilModification'
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profil'
        '422':
          $ref: '#/components/responses/Validation'
    delete:
      tags:
      - Profil
      summary: Supprimer mon compte (statut SUPPRIME)
      x-roles:
      - TRAVAILLEUR
      - RECRUTEUR
      responses:
        '204':
          description: Compte supprimé
  /v1/me/metiers:
    put:
      tags:
      - Profil
      summary: Remplacer mes métiers
      x-roles:
      - TRAVAILLEUR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                - metierId
                properties:
                  metierId:
                    type: string
                    format: uuid
                  experienceAnnees:
                    type: integer
                    minimum: 0
      responses:
        '200':
          description: Métiers enregistrés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfilMetier'
        '422':
          $ref: '#/components/responses/Validation'
  /v1/me/zones:
    put:
      tags:
      - Profil
      summary: Remplacer mes zones de travail
      x-roles:
      - TRAVAILLEUR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - zoneIds
              properties:
                zoneIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Zones enregistrées
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
        '422':
          $ref: '#/components/responses/Validation'
  /v1/me/pause:
    put:
      tags:
      - Disponibilités
      summary: Me mettre en pause ou reprendre (plus de propositions)
      x-roles:
      - TRAVAILLEUR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enPause
              properties:
                enPause:
                  type: boolean
                jusquau:
                  type: string
                  format: date
                  description: Reprise automatique à cette date (optionnel)
      responses:
        '200':
          description: État de pause
          content:
            application/json:
              schema:
                type: object
                properties:
                  enPause:
                    type: boolean
                  jusquau:
                    type: string
                    format: date
                    nullable: true
  /v1/me/consentements:
    get:
      tags:
      - Profil
      summary: Mes consentements par canal
      x-roles:
      - tous
      responses:
        '200':
          description: Liste des consentements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consentement'
    put:
      tags:
      - Profil
      summary: Accorder ou retirer un consentement (désinscription possible à tout moment)
      x-roles:
      - tous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentementEntree'
      responses:
        '200':
          description: Consentement enregistré (tracé avec date et auteur)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consentement'
  /v1/metiers:
    get:
      tags:
      - Référentiels
      summary: Liste des métiers actifs
      x-roles:
      - tous
      parameters:
      - name: categorie
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Métiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Metier'
              example:
              - *id003
              - *id004
              - &id008
                id: 00000000-0000-4000-8000-000000000102
                libelle: Lessiveuse
                categorie: Maison
                actif: true
              - id: 00000000-0000-4000-8000-000000000103
                libelle: Repasseuse
                categorie: Maison
                actif: true
              - &id010
                id: 00000000-0000-4000-8000-000000000104
                libelle: Jardinier
                categorie: Extérieur
                actif: true
              - id: 00000000-0000-4000-8000-000000000105
                libelle: Aide-ménagère
                categorie: Maison
                actif: true
              - id: 00000000-0000-4000-8000-000000000106
                libelle: Manutentionnaire
                categorie: Logistique
                actif: true
  /v1/zones:
    get:
      tags:
      - Référentiels
      summary: Liste des zones (hiérarchie région > département > commune > quartier)
      x-roles:
      - tous
      parameters:
      - name: parentId
        in: query
        schema:
          type: string
          format: uuid
      - name: niveau
        in: query
        schema:
          $ref: '#/components/schemas/NiveauZone'
      responses:
        '200':
          description: Zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
              example:
              - *id005
              - id: 00000000-0000-4000-8000-000000000201
                nom: Guédiawaye
                niveau: COMMUNE
                parentId: null
              - id: 00000000-0000-4000-8000-000000000202
                nom: Parcelles Assainies
                niveau: COMMUNE
                parentId: null
              - &id009
                id: 00000000-0000-4000-8000-000000000203
                nom: Médina
                niveau: COMMUNE
                parentId: null
              - &id011
                id: 00000000-0000-4000-8000-000000000204
                nom: Rufisque
                niveau: COMMUNE
                parentId: null
              - *id006
  /v1/missions:
    get:
      tags:
      - Missions
      summary: Lister des missions
      description: '- TRAVAILLEUR, `portee=pertinentes` : missions compatibles avec son profil (métier,
        zone, disponibilité).

        - RECRUTEUR, `portee=miennes` : ses propres missions.'
      x-roles:
      - TRAVAILLEUR
      - RECRUTEUR
      parameters:
      - name: portee
        in: query
        schema:
          type: string
          enum:
          - pertinentes
          - miennes
          default: pertinentes
      - name: statut
        in: query
        schema:
          $ref: '#/components/schemas/StatutMission'
      - name: metierId
        in: query
        schema:
          type: string
          format: uuid
      - name: zoneId
        in: query
        schema:
          type: string
          format: uuid
      - name: dateDebut
        in: query
        schema:
          type: string
          format: date
      - name: dateFin
        in: query
        schema:
          type: string
          format: date
      - name: urgente
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page de missions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMissions'
              example:
                items:
                - &id012
                  id: 00000000-0000-4000-8000-000000000301
                  recruteur: &id007
                    id: 00000000-0000-4000-8000-000000000001
                    nom: Aïssatou Ndiaye
                    telephone: null
                    scoreFiabilite: null
                    noteMoyenne: 4.8
                  metier: *id003
                  zone: *id005
                  description: Dalle à couler, matériel fourni.
                  nombrePostes: 2
                  postesConfirmes: 0
                  postesRestants: 2
                  date: '2026-11-10'
                  typeHoraire: TRAVAIL_JOURNALIER
                  heureDebut: null
                  heureFin: null
                  heureArriveeIndicative: 07:30
                  remunerationFcfa: 12000
                  urgente: false
                  modeAttribution: SELECTION
                  statut: PUBLIEE
                  creeLe: '2026-11-08T16:00:00Z'
                - id: 00000000-0000-4000-8000-000000000302
                  recruteur: *id007
                  metier: *id008
                  zone: *id009
                  description: null
                  nombrePostes: 1
                  postesConfirmes: 1
                  postesRestants: 0
                  date: '2026-11-09'
                  typeHoraire: DEMI_JOURNEE
                  heureDebut: null
                  heureFin: null
                  heureArriveeIndicative: 07:30
                  remunerationFcfa: 7000
                  urgente: true
                  modeAttribution: PREMIER_ARRIVE
                  statut: POURVUE
                  creeLe: '2026-11-08T16:00:00Z'
                - id: 00000000-0000-4000-8000-000000000303
                  recruteur: *id007
                  metier: *id010
                  zone: *id011
                  description: null
                  nombrePostes: 1
                  postesConfirmes: 1
                  postesRestants: 0
                  date: '2026-11-08'
                  typeHoraire: TRAVAIL_JOURNALIER
                  heureDebut: null
                  heureFin: null
                  heureArriveeIndicative: 07:30
                  remunerationFcfa: 8000
                  urgente: false
                  modeAttribution: SELECTION
                  statut: TERMINEE
                  creeLe: '2026-11-08T16:00:00Z'
                total: 3
                page: 1
                taille: 20
    post:
      tags:
      - Missions
      summary: Publier une mission
      description: Valide les règles (RB-01 durée d'au plus une journée, RB-19, cohérence du type d'horaire),
        enregistre en PUBLIEE (ou BROUILLON), puis déclenche le matching.
      x-roles:
      - RECRUTEUR
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionCreation'
      responses:
        '201':
          description: Mission créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
              example: *id012
        '422':
          $ref: '#/components/responses/Validation'
  /v1/missions/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Missions
      summary: Détail d'une mission
      x-roles:
      - TRAVAILLEUR
      - RECRUTEUR
      responses:
        '200':
          description: Mission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
              example: *id012
        '404':
          $ref: '#/components/responses/Introuvable'
    patch:
      tags:
      - Missions
      summary: Modifier une mission (tant qu'elle n'est pas EN_COURS)
      x-roles:
      - RECRUTEUR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionModification'
      responses:
        '200':
          description: Mission mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
              example: *id012
        '409':
          $ref: '#/components/responses/Conflit'
        '422':
          $ref: '#/components/responses/Validation'
  /v1/missions/{id}/annulation:
    post:
      tags:
      - Missions
      summary: Annuler une mission (les candidats confirmés sont prévenus)
      x-roles:
      - RECRUTEUR
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motif:
                  type: string
      responses:
        '200':
          description: Mission ANNULEE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
              example:
                id: 00000000-0000-4000-8000-000000000301
                recruteur: *id007
                metier: *id003
                zone: *id005
                description: Dalle à couler, matériel fourni.
                nombrePostes: 2
                postesConfirmes: 0
                postesRestants: 2
                date: '2026-11-10'
                typeHoraire: TRAVAIL_JOURNALIER
                heureDebut: null
                heureFin: null
                heureArriveeIndicative: 07:30
                remunerationFcfa: 12000
                urgente: false
                modeAttribution: SELECTION
                statut: ANNULEE
                creeLe: '2026-11-08T16:00:00Z'
        '409':
          $ref: '#/components/responses/Conflit'
  /v1/missions/{id}/duplication:
    post:
      tags:
      - Missions
      summary: Dupliquer une mission avec une nouvelle date
      x-roles:
      - RECRUTEUR
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - date
              properties:
                date:
                  type: string
                  format: date
      responses:
        '201':
          description: Nouvelle mission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
              example:
                id: 00000000-0000-4000-8000-000000000304
                recruteur: *id007
                metier: *id003
                zone: *id005
                description: Dalle à couler, matériel fourni.
                nombrePostes: 2
                postesConfirmes: 0
                postesRestants: 2
                date: '2026-11-12'
                typeHoraire: TRAVAIL_JOURNALIER
                heureDebut: null
                heureFin: null
                heureArriveeIndicative: 07:30
                remunerationFcfa: 12000
                urgente: false
                modeAttribution: SELECTION
                statut: PUBLIEE
                creeLe: '2026-11-08T16:00:00Z'
  /v1/missions/{id}/cloture:
    post:
      tags:
      - Missions
      summary: Clôturer la mission et saisir les présences
      x-roles:
      - RECRUTEUR
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - presences
              properties:
                presences:
                  type: array
                  items:
                    type: object
                    required:
                    - candidatureId
                    - presence
                    properties:
                      candidatureId:
                        type: string
                        format: uuid
                      presence:
                        type: string
                        enum:
                        - PRESENT
                        - ABSENT
      responses:
        '200':
          description: Mission TERMINEE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
              example:
                id: 00000000-0000-4000-8000-000000000302
                recruteur: *id007
                metier: *id008
                zone: *id009
                description: null
                nombrePostes: 1
                postesConfirmes: 1
                postesRestants: 0
                date: '2026-11-09'
                typeHoraire: DEMI_JOURNEE
                heureDebut: null
                heureFin: null
                heureArriveeIndicative: 07:30
                remunerationFcfa: 7000
                urgente: true
                modeAttribution: PREMIER_ARRIVE
                statut: TERMINEE
                creeLe: '2026-11-08T16:00:00Z'
        '409':
          $ref: '#/components/responses/Conflit'
  /v1/missions/{id}/candidatures:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Candidatures
      summary: Candidatures d'une mission
      x-roles:
      - RECRUTEUR
      parameters:
      - name: statut
        in: query
        schema:
          $ref: '#/components/schemas/StatutCandidature'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page de candidatures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCandidatures'
              example:
                items:
                - &id013
                  id: 00000000-0000-4000-8000-000000000501
                  missionId: 00000000-0000-4000-8000-000000000301
                  mission: &id014
                    id: 00000000-0000-4000-8000-000000000301
                    metier: *id003
                    zone: *id005
                    date: '2026-11-10'
                    typeHoraire: TRAVAIL_JOURNALIER
                    remunerationFcfa: 12000
                    statut: PUBLIEE
                  travailleur: &id015
                    id: 00000000-0000-4000-8000-000000000401
                    nom: Moussa Ndiaye
                    telephone: null
                    scoreFiabilite: 94.0
                    noteMoyenne: 4.7
                  statut: INTERESSE
                  canal: APPLICATION
                  dateReponse: '2026-11-09T07:40:00Z'
                  expireLe: null
                  positionListeAttente: null
                  confirmation: null
                - id: 00000000-0000-4000-8000-000000000502
                  missionId: 00000000-0000-4000-8000-000000000301
