        '503':
          description: Pas prêt
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Taille:
      name: taille
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID généré par le client ; rejouer la même requête renvoie le même résultat sans doublon.
      schema:
        type: string
        format: uuid
  responses:
    NonAuthentifie:
      description: Jeton absent, expiré ou code invalide
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
    Introuvable:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
    Validation:
      description: Données invalides
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
          example:
            type: about:blank
            status: 422
            code: VALIDATION
            title: Données invalides
            detail: Corrigez les champs indiqués.
            correlationId: mock-0001
            errors:
            - champ: remunerationFcfa
              message: Doit être supérieur à 0.
    Conflit:
      description: Conflit avec une règle métier (voir `code`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
          examples:
            capacite:
              value:
                type: about:blank
                status: 409
                code: CAPACITE_ATTEINTE
                title: Capacité atteinte
                detail: Tous les postes de cette mission sont déjà retenus ou confirmés.
                correlationId: mock-0001
            chevauchement:
              value:
                type: about:blank
                status: 409
                code: CHEVAUCHEMENT
                title: Chevauchement d’horaire
                detail: Vous avez déjà une mission confirmée ce jour-là.
                correlationId: mock-0001
            indisponible:
              value:
                type: about:blank
                status: 409
                code: MISSION_INDISPONIBLE
                title: Mission indisponible
                detail: Cette mission est déjà pourvue.
                correlationId: mock-0001
            expiree:
              value:
                type: about:blank
                status: 409
                code: PROPOSITION_EXPIREE
                title: Délai dépassé
                detail: Le délai de confirmation est écoulé.
                correlationId: mock-0001
    TropDeRequetes:
      description: Limitation de débit atteinte
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
  schemas:
    Erreur:
      type: object
      required:
      - status
      - code
      - title
      properties:
        status:
          type: integer
          example: 409
        code:
          type: string
          description: Code stable à utiliser côté client pour choisir le message affiché
          enum:
          - VALIDATION
          - NON_AUTHENTIFIE
          - OTP_INVALIDE
          - INTERDIT
          - INTROUVABLE
          - CAPACITE_ATTEINTE
          - CHEVAUCHEMENT
          - MISSION_INDISPONIBLE
          - PROPOSITION_EXPIREE
          - TRANSITION_INVALIDE
          - DOUBLON
          - TROP_DE_REQUETES
        title:
          type: string
          example: Capacité atteinte
        detail:
          type: string
          example: Tous les postes de cette mission sont pourvus.
        correlationId:
          type: string
        errors:
          type: array
          description: Détail par champ pour les erreurs 422
          items:
            type: object
            properties:
              champ:
                type: string
                example: remunerationFcfa
              message:
                type: string
    Telephone:
      type: string
      description: Format international E.164
      example: '+221771234567'
      pattern: ^\+[1-9][0-9]{7,14}$
    Role:
      type: string
      enum:
      - TRAVAILLEUR
      - RECRUTEUR
    StatutCompte:
      type: string
      enum:
      - ACTIF
      - SUSPENDU
      - SUPPRIME
    TypeRecruteur:
      type: string
      enum:
      - PARTICULIER
      - ENTREPRISE
    TypeHoraire:
      type: string
      enum:
      - TRAVAIL_JOURNALIER
      - DEMI_JOURNEE
      - CRENEAU_PRECIS
    ModeAttribution:
      type: string
      enum:
      - PREMIER_ARRIVE
      - SELECTION
    StatutMission:
      type: string
      enum:
      - BROUILLON
      - PUBLIEE
      - PARTIELLEMENT_POURVUE
      - POURVUE
      - EN_COURS
      - TERMINEE
      - ANNULEE
      - EXPIREE
      - SUSPENDUE
    StatutCandidature:
      type: string
      enum:
      - PROPOSEE
      - INTERESSE
      - SELECTIONNEE
      - CONFIRMEE
      - REFUSEE
      - EXPIREE
      - RETIREE
      - ANNULEE
      - LISTE_ATTENTE
    Canal:
      type: string
      enum:
      - APPLICATION
      - WHATSAPP
      - APPEL
      - SMS
    PeriodeDispo:
      type: string
      enum:
      - JOURNEE
      - MATIN
      - APRES_MIDI
      - CRENEAU
    NiveauZone:
      type: string
      enum:
      - REGION
      - DEPARTEMENT
      - COMMUNE
      - QUARTIER
    Presence:
      type: string
      enum:
      - NON_SAISIE
      - PRESENT
      - ABSENT
    StatutSignalement:
      type: string
      enum:
      - OUVERT
      - EN_COURS
      - TRAITE
      - REJETE
    Jetons:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresIn
      - utilisateur
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Durée de vie du jeton d'accès en secondes
          example: 900
        nouveauCompte:
          type: boolean
        utilisateur:
          $ref: '#/components/schemas/Profil'
    Profil:
      type: object
      required:
      - id
      - role
      - statut
      properties:
        id:
          type: string
          format: uuid
        telephone:
          $ref: '#/components/schemas/Telephone'
        nom:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        statut:
          $ref: '#/components/schemas/StatutCompte'
        langue:
          type: string
          example: fr
        creeLe:
          type: string
          format: date-time
        scoreFiabilite:
          type: number
          format: float
          nullable: true
          description: Travailleur
        possedeSonMateriel:
          type: boolean
          description: Travailleur
        enPause:
          type: boolean
          description: Travailleur
        metiers:
          type: array
          description: Travailleur
          items:
            $ref: '#/components/schemas/ProfilMetier'
        zones:
          type: array
          description: Travailleur
          items:
            $ref: '#/components/schemas/Zone'
        typeRecruteur:
          $ref: '#/components/schemas/TypeRecruteur'
        raisonSociale:
          type: string
          nullable: true
          description: Recruteur de type ENTREPRISE
        perimetre:
          type: string
          nullable: true
          description: Agent
    ProfilModification:
      type: object
      properties:
        nom:
          type: string
        langue:
          type: string
        possedeSonMateriel:
          type: boolean
        typeRecruteur:
          $ref: '#/components/schemas/TypeRecruteur'
        raisonSociale:
          type: string
    ResumeUtilisateur:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string
        telephone:
          allOf:
          - $ref: '#/components/schemas/Telephone'
          nullable: true
          description: null tant que la candidature n'est pas CONFIRMEE (RB-17)
        scoreFiabilite:
          type: number
          format: float
          nullable: true
        noteMoyenne:
          type: number
          format: float
          nullable: true
    Metier:
      type: object
      properties:
        id:
          type: string
          format: uuid
        libelle:
          type: string
          example: Maçon
        categorie:
          type: string
          example: Bâtiment
        actif:
          type: boolean
    ProfilMetier:
      type: object
      properties:
        metier:
          $ref: '#/components/schemas/Metier'
        experienceAnnees:
          type: integer
          minimum: 0
    Zone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string
          example: Pikine
        niveau:
          $ref: '#/components/schemas/NiveauZone'
        parentId:
          type: string
          format: uuid
          nullable: true
    ConsentementEntree:
      type: object
      required:
      - canal
      - accorde
      properties:
        canal:
          $ref: '#/components/schemas/Canal'
        accorde:
          type: boolean
    Consentement:
      allOf:
      - $ref: '#/components/schemas/ConsentementEntree'
      - type: object
        properties:
          date:
            type: string
            format: date-time
          recueilliPar:
            type: string
            format: uuid
            description: Utilisateur ou agent qui a recueilli le consentement
    Mission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recruteur:
          $ref: '#/components/schemas/ResumeUtilisateur'
        metier:
          $ref: '#/components/schemas/Metier'
        zone:
          $ref: '#/components/schemas/Zone'
        description:
          type: string
