openapi: 3.1.0
info:
  title: XeuySil API, mock recruteur (contrat d'Ibrahima + exemples)
  version: 1.0.0
  description: 'Contrat API unique de la plateforme XeuySil pour la mise en relation entre travailleurs journaliers,

    recruteurs, agents et administrateurs. Cette spécification est alignée sur le schéma PostgreSQL et la logique

    métier de Supabase Auth, PostgreSQL, Prisma et NestJS.

    '
  contact:
    name: XeuySil Platform Team
    email: platform@xeuysil.com
servers:
- url: http://localhost:4010
  description: Mock Prism (exemples ajoutés)
security:
- bearerAuth: []
tags:
- name: Auth
  description: Inscription, connexion, mot de passe et session utilisateur.
- name: Public
  description: Endpoints publics de statistiques et données de démarrage.
- name: Bootstrap
  description: Données initiales nécessaires au démarrage du front.
- name: Metiers
  description: Référentiel métier centralisé et contrôlé.
- name: Zones
  description: Structure géographique hiérarchique.
- name: Travailleurs
  description: Gestion du profil, disponibilités et activités du travailleur.
- name: Recruteurs
  description: Gestion du profil recruteur et du suivi d’activité.
- name: Agents
  description: Gestion du profil agent et proposition de travailleurs.
- name: Missions
  description: Création, publication, clôture et suivi des missions.
- name: Candidatures
  description: Candidatures, sélection, confirmation et rejet.
- name: Disponibilites
  description: Disponibilités journalières et créneaux de travail.
- name: Evaluations
  description: Évaluations entre utilisateurs et missions.
- name: Notifications
  description: Notifications utilisateur et messagerie WhatsApp.
- name: Dashboard
  description: Indicateurs et synthèses métier par profil.
- name: Admin
  description: Administration système et gestion de plateforme.
- name: Commissions
  description: Calculs et résumés de commissions.
- name: WhatsApp
  description: Webhooks et envoi de messages WhatsApp.
- name: PlatformSettings
  description: Paramètres globaux applicatifs.
paths:
  /auth/register/worker:
    post:
      tags:
      - Auth
      summary: Inscription d’un travailleur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterWorkerDto'
            examples:
              default:
                value:
                  email: worker@example.com
                  password: StrongPass123!
                  nom: Kouassi Jean
                  telephone: '+2250701020304'
                  langue: fr
                  metierIds:
                  - 2d1c2f4d-6f3d-46e3-87ef-4c7df52995f5
      responses:
        '201':
          description: Exemple
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              example:
                success: true
                message: Création réussie
                data:
                  id: 00000009-0000-4000-8000-000000000009
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/register/recruiter:
    post:
      tags:
      - Auth
      summary: Inscription d’un recruteur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRecruiterDto'
            examples:
              default:
                value:
                  email: recruteur@example.com
                  password: StrongPass123!
                  nom: Awa Diop
                  telephone: '+2250701020305'
                  langue: fr
                  typeRecruteur: ENTREPRISE
                  raisonSociale: BuildPro SARL
      responses:
        '201':
          description: Exemple
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              example:
                success: true
                message: Création réussie
                data:
                  id: 00000009-0000-4000-8000-000000000009
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Connexion utilisateur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
            examples:
              default:
                value:
                  email: user@example.com
                  password: StrongPass123!
      responses:
        '200':
          description: Exemple
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              example:
                success: true
                message: Authentification réussie
                data:
                  accessToken: mock.access.token
                  refreshToken: mock.refresh.token
                  user: &id001
                    id: 00000001-0000-4000-8000-000000000001
                    email: recruteur@xeuysil.test
                    role: RECRUTEUR
                    statut: ACTIF
                    createdAt: '2026-10-12T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Demande de réinitialisation du mot de passe
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordDto'
            examples:
              default:
                value:
                  email: user@example.com
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Réinitialiser le mot de passe
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
            examples:
              default:
                value:
                  token: reset-token-123
                  password: NewStrongPass456!
                  passwordConfirmation: NewStrongPass456!
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Déconnexion de l’utilisateur
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh-token:
    post:
      tags:
      - Auth
      summary: Rafraîchir le token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            examples:
              default:
                value:
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Exemple
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              example:
                success: true
                message: Token rafraîchi
                data:
                  accessToken: mock.access.token
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Retourne le profil courant
      responses:
        '200':
          description: Exemple
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              example:
                success: true
                message: Profil chargé
                data: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /bootstrap:
    get:
      tags:
      - Bootstrap
      summary: Charge les données initiales du front
      security: []
      responses:
        '200':
          description: Exemple
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              example:
                success: true
                message: Bootstrap chargé
                data:
                  metiers:
                  - &id002
                    id: 00000100-0000-4000-8000-000000000100
                    code: MACON
                    libelle: Maçon
                    categorie: BTP
                    actif: true
                  - &id003
                    id: 00000100-0000-4000-8000-000000000101
                    code: MENUISIER
                    libelle: Menuisier
                    categorie: BTP
                    actif: true
                  - &id004
                    id: 00000100-0000-4000-8000-000000000102
                    code: MANOEUVRE
                    libelle: Manœuvre
                    categorie: BTP
                    actif: true
                  - &id005
                    id: 00000100-0000-4000-8000-000000000103
                    code: LESSIVEUSE
                    libelle: Lessiveuse
                    categorie: Maison
                    actif: true
                  - &id006
                    id: 00000100-0000-4000-8000-000000000104
                    code: REPASSEUSE
                    libelle: Repasseuse
                    categorie: Maison
                    actif: true
                  - &id007
                    id: 00000100-0000-4000-8000-000000000105
                    code: JARDINIER
                    libelle: Jardinier
                    categorie: Extérieur
                    actif: true
                  - &id008
                    id: 00000100-0000-4000-8000-000000000106
                    code: AIDE_MENAGERE
                    libelle: Aide-ménagère
                    categorie: Maison
                    actif: true
                  - &id009
                    id: 00000100-0000-4000-8000-000000000107
                    code: MANUTENTIONNAIRE
                    libelle: Manutentionnaire
                    categorie: Logistique
                    actif: true
                  zones:
                  - &id010
                    id: 00000200-0000-4000-8000-000000000200
                    nom: Pikine
                    niveau: COMMUNE
                    parentId: null
                  - &id011
                    id: 00000200-0000-4000-8000-000000000201
                    nom: Guédiawaye
                    niveau: COMMUNE
                    parentId: null
                  - &id012
                    id: 00000200-0000-4000-8000-000000000202
                    nom: Parcelles Assainies
                    niveau: COMMUNE
                    parentId: null
                  - &id013
                    id: 00000200-0000-4000-8000-000000000203
                    nom: Médina
                    niveau: COMMUNE
                    parentId: null
                  - &id014
                    id: 00000200-0000-4000-8000-000000000204
                    nom: Rufisque
                    niveau: COMMUNE
                    parentId: null
                  - &id015
                    id: 00000200-0000-4000-8000-000000000205
                    nom: Thiaroye
                    niveau: COMMUNE
                    parentId: null
                  settings:
                    commissionPercent: 10
                    missionAutoCloseDays: 7
        '500':
          $ref: '#/components/responses/InternalServerError'
  /public/stats:
    get:
      tags:
      - Public
      summary: Statistiques publiques
      security: []
      responses:
        '200':
          description: Statistiques publiques
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              examples:
                success:
                  value:
                    success: true
                    data:
                      workers: 1450
                      recruiters: 350
                      missions: 2800
                      placements: 2100
        '500':
          $ref: '#/components/responses/InternalServerError'
  /metiers:
    get:
      tags:
      - Metiers
      summary: Liste des métiers actifs
      security: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SortParam'
      - $ref: '#/components/parameters/OrderParam'
      responses:
        '200':
          description: Exemple
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              example:
                success: true
                message: Opération réussie
                data:
                - *id002
                - *id003
                - *id004
                - *id005
                - *id006
                - *id007
                - *id008
                - *id009
        '500':
          $ref: '#/components/responses/InternalServerError'
  /metiers/{id}:
    get:
      tags:
      - Metiers
      summary: Détail d’un métier
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Métier trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              examples:
                success:
                  value:
                    success: true
                    data:
                      id: 7c700d72-db9f-4575-8b66-c30ef24d1f7c
                      code: MACON
                      libelle: Maçon
                      categorie: BTP
                      actif: true
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /zones:
    get:
      tags:
      - Zones
      summary: Liste des zones
      security: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Exemple
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              example:
                success: true
                message: Opération réussie
                data:
                - *id010
                - *id011
                - *id012
                - *id013
                - *id014
                - *id015
        '500':
          $ref: '#/components/responses/InternalServerError'
  /zones/{id}:
    get:
      tags:
      - Zones
      summary: Détail d’une zone
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /travailleurs/me:
    get:
      tags:
      - Travailleurs
      summary: Profil du travailleur courant
      responses:
        '200':
          description: Profil travailleur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              examples:
                success:
                  value:
                    success: true
                    data:
                      userId: d5fa1a2d-9f7a-49b8-bd87-fdff5f2f2d1a
                      scoreFiabilite: 94.56
                      possedeSonMateriel: true
                      agentId: ef8f1e38-7905-4519-927d-c58d1a1d4a81
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Travailleurs
      summary: Met à jour le profil travailleur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerProfileDto'
            examples:
              default:
                value:
                  scoreFiabilite: 96.2
                  possedeSonMateriel: true
                  agentId: ef8f1e38-7905-4519-927d-c58d1a1d4a81
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /travailleurs/dashboard:
    get:
      tags:
      - Travailleurs
      summary: Tableau de bord du travailleur
      responses:
        '200':
          description: Dashboard travailleur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              examples:
                success:
                  value:
                    success: true
                    data:
                      missionsCompleted: 42
                      missionsPending: 8
                      grossRevenue: 540000
                      platformCommission: 54000
                      netRevenue: 486000
                      scoreFiabilite: 94.56
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /travailleurs/commissions:
    get:
      tags:
      - Travailleurs
      summary: Commissions du travailleur
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /travailleurs/missions:
    get:
      tags:
      - Travailleurs
      summary: Missions du travailleur
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SortParam'
      - $ref: '#/components/parameters/OrderParam'
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /travailleurs/candidatures:
    get:
      tags:
      - Travailleurs
      summary: Candidatures du travailleur
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SortParam'
      - $ref: '#/components/parameters/OrderParam'
      - $ref: '#/components/parameters/CandidatureStatutParam'
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /recruteurs/me:
    get:
      tags:
      - Recruteurs
      summary: Profil du recruteur courant
      responses:
        '200':
          description: Exemple
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              example:
                success: true
                message: Opération réussie
                data:
                  userId: 00000001-0000-4000-8000-000000000001
                  typeRecruteur: PARTICULIER
                  raisonSociale: Aïssatou Ndiaye
                  profile:
                    id: 00000001-0000-4000-8000-000000000001
                    nom: Aïssatou Ndiaye
                    telephone: '+221771234567'
                    role: RECRUTEUR
                    statut: ACTIF
                    langue: fr
                    photoUrl: null
                    createdAt: '2026-10-12T09:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Recruteurs
      summary: Mise à jour du recruteur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruiterProfileDto'
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /recruteurs/dashboard:
    get:
      tags:
      - Recruteurs
      summary: Tableau de bord recruteur
      responses:
        '200':
          description: Exemple
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              example:
                success: true
                message: Opération réussie
                data:
                  missionsPublished: 3
                  activeCandidates: 3
                  pendingResponses: 2
                  totalRevenue: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /agents/me:
    get:
      tags:
      - Agents
      summary: Profil de l’agent courant
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Agents
      summary: Mise à jour du profil agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProfileDto'
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /agents/dashboard:
    get:
      tags:
      - Agents
      summary: Tableau de bord agent
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /agents/workers:
    get:
      tags:
      - Agents
      summary: Liste des travailleurs assignés
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /agents/proposals:
    post:
      tags:
      - Agents
      summary: Soumettre une proposition d’affectation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - travailleurId
              - missionId
              - message
              properties:
                travailleurId:
                  type: string
                  format: uuid
                missionId:
                  type: string
                  format: uuid
                message:
                  type: string
                  example: Travailleur adapté au profil demandé.
      responses:
        '201':
          $ref: '#/components/responses/CreatedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /missions/public:
    get:
      tags:
      - Missions
      summary: Missions publiques visibles
      security: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SortParam'
      - $ref: '#/components/parameters/OrderParam'
      - $ref: '#/components/parameters/DateParam'
      - $ref: '#/components/parameters/MetierParam'
      - $ref: '#/components/parameters/ZoneParam'
      - $ref: '#/components/parameters/StatutMissionParam'
      - $ref: '#/components/parameters/UrgenteParam'
      responses:
        '200':
          $ref: '#/components/responses/Success200'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /missions/recommended:
    get:
      tags:
      - Missions
      summary: Missions recommandées pour le travailleur
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Exemple
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
              example:
                success: true
                message: Opération réussie
                data:
                  items:
                  - &id016
                    id: 00000300-0000-4000-8000-000000000001
                    recruteurId: 00000001-0000-4000-8000-000000000001
                    metierId: 00000100-0000-4000-8000-000000000100
