components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT fourni par Supabase Auth ou l’API backend.
  parameters:
    PageParam:
      name: page
      in: query
      description: Numéro de page pour la pagination.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Nombre d’éléments par page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortParam:
      name: sort
      in: query
      description: Champ utilisé pour le tri.
      required: false
      schema:
        type: string
        example: createdAt
    OrderParam:
      name: order
      in: query
      description: Ordre de tri ascendant ou descendant.
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
    DateParam:
      name: date
      in: query
      description: Filtre de date au format ISO.
      required: false
      schema:
        type: string
        format: date
    MetierParam:
      name: metier
      in: query
      description: Identifiant du métier à filtrer.
      required: false
      schema:
        type: string
        format: uuid
    ZoneParam:
      name: zone
      in: query
      description: Identifiant de la zone géographique à filtrer.
      required: false
      schema:
        type: string
        format: uuid
    StatutMissionParam:
      name: statut
      in: query
      description: Filtre sur le statut de la mission.
      required: false
      schema:
        $ref: '#/components/schemas/statut_mission_enum'
    UrgenteParam:
      name: urgente
      in: query
      description: Filtre sur les missions urgentes.
      required: false
      schema:
        type: boolean
    CandidatureStatutParam:
      name: statut
      in: query
      description: Filtre sur le statut de candidature.
      required: false
      schema:
        $ref: '#/components/schemas/statut_candidature_enum'
    NotificationLuParam:
      name: lu
      in: query
      description: Filtre sur l’état de lecture des notifications.
      required: false
      schema:
        type: boolean
  responses:
    Success200:
      description: Opération réussie
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccessResponse'
          examples:
            success:
              value:
                success: true
                message: Opération réussie
                data: {}
    CreatedSuccess:
      description: Création réussie
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccessResponse'
          examples:
            created:
              value:
                success: true
                message: Création réussie
                data:
                  id: 8ff0d3f9-c1d7-4b06-aa7d-5bced61fb6d8
    NoContent:
      description: Aucune donnée à renvoyer
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            invalid:
              value:
                success: false
                message: Données invalides
                errors:
                - field: email
                  message: L’email est requis
    Unauthorized:
      description: Non autorisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            unauthorized:
              value:
                success: false
                message: Jeton JWT invalide ou expiré
                errorCode: UNAUTHORIZED
    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            forbidden:
              value:
                success: false
                message: Vous n’avez pas les droits requis
                errorCode: FORBIDDEN
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            notFound:
              value:
                success: false
                message: Ressource introuvable
                errorCode: NOT_FOUND
    Conflict:
      description: Conflit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            conflict:
              value:
                success: false
                message: Conflit de données
                errorCode: CONFLICT
    UnprocessableEntity:
      description: Données non traitables
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            validation:
              value:
                success: false
                message: La validation a échoué
                errors:
                - field: remunerationFcfa
                  message: La rémunération doit être positive
    InternalServerError:
      description: Erreur interne du serveur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            serverError:
              value:
                success: false
                message: Erreur interne du serveur
                errorCode: INTERNAL_SERVER_ERROR
  schemas:
    ApiSuccessResponse:
      type: object
      additionalProperties: true
      required:
      - success
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
        data:
          nullable: true
      description: Réponse standard pour les opérations réussies.
    ApiErrorResponse:
      type: object
      required:
      - success
      - message
      - errorCode
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errorCode:
          type: string
          example: NOT_FOUND
        details:
          type: object
          additionalProperties: true
          nullable: true
      description: Réponse standard pour les erreurs applicatives.
    ValidationErrorResponse:
      allOf:
      - $ref: '#/components/schemas/ApiErrorResponse'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: array
            items:
              $ref: '#/components/schemas/ValidationErrorItem'
    ValidationErrorItem:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: L’email est invalide
    PaginationResponse:
      type: object
      required:
      - page
      - limit
      - totalItems
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          example: 20
        totalItems:
          type: integer
          minimum: 0
          example: 126
        totalPages:
          type: integer
          minimum: 0
          example: 7
        sort:
          type: string
          nullable: true
          example: createdAt
        order:
          type: string
          enum:
          - asc
          - desc
          nullable: true
          example: desc
    role_enum:
